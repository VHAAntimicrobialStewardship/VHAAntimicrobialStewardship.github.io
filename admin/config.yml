backend:
  name: github
  repo: VHAAntimicrobialStewardship/VHAAntimicrobialStewardship.github.io
  branch: main
  base_url: https://sveltia-cms-auth.vhaasptechnical.workers.dev
  client_id: Ov23liumAwFrn0Aunz89

publish_mode: simple
site_url: https://VHAAntimicrobialStewardship.github.io/
display_url: https://VHAAntimicrobialStewardship.github.io/
media_folder: "assets/uploads"
public_folder: "/assets/uploads"
editor:
  preview: false

collections:
  - label: "Antibiotic Links"
    name: "abx_links"
    files:
      - label: "Antibiotic Links"
        name: "abx_links"
        file: "cms-data/abx-links.cms.json"
        format: "json"
        extension: "json"
        fields:
          - label: "Entries"
            name: "entries"
            widget: list
            fields:
              - { label: "Name", name: "Name", widget: "string", required: false }
              - { label: "URL", name: "URL", widget: "string", required: false }
              - { label: "Route Filter", name: "RouteFilter", widget: "string", required: false }
  - label: "Site Settings"
    name: "site_settings"
    files:
      - label: "Web Manifest"
        name: "web_manifest"
        file: "manifest.webmanifest"
        format: "json"
        extension: "json"
        identifier_field: name
        summary: "{{name}}"
        fields:
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Short Name", name: "short_name", widget: "string"}
          - {label: "Description", name: "description", widget: "string", required: false}
          - {label: "Scope", name: "scope", widget: "string"}
          - {label: "Start URL", name: "start_url", widget: "string"}
          - {label: "Background Color", name: "background_color", widget: "string"}
          - {label: "Theme Color", name: "theme_color", widget: "string"}
          - {label: "Display", name: "display", widget: "string"}
          - label: "Icons"
            name: "icons"
            widget: list
            fields:
              - {label: "Src", name: "src", widget: "string"}
              - {label: "Sizes", name: "sizes", widget: "string"}
              - {label: "Type", name: "type", widget: "string"}
              - {label: "Purpose", name: "purpose", widget: "string", required: false}
  - label: "001-TestStation"
    name: "001tes_all_pages"
    folder: "cms-data/001-TestStation/pages"
    path: "{{fields.Group}}/{{fields.PageID}}"
    create: true
    format: json
    extension: json
    editor:
      preview: false
    identifier_field: PageID
    summary: "{{fields.Term1}} [{{fields.PageID}}]"
    sortable_fields:
      fields: ["SortKey", "PageID", "Term1", "Group"]
      default:
        field: "SortKey"
        direction: "Ascending"
    # EXPERIMENTAL: adds "Group by Clinical Group" section headers in the Sveltia
    # entry list, active by default. To revert to the status quo (flat list, no
    # headers), simply delete this whole view_groups block.
    view_groups:
      groups:
        - name: clinical_group
          label: "Clinical Group"
          field: GroupLabel
      default: clinical_group
    fields:
      - label: "Page ID"
        name: PageID
        widget: string
        hint: "Immutable identifier used in links. Set once when creating — never change."
        pattern: ['^[a-z0-9][a-z0-9\-]*$', 'Lowercase letters, numbers, hyphens only']
      - label: "Group"
        name: Group
        widget: select
        hint: "Clinical group used for organization and file path under pages/."
        options:
          - { label: "Bone, Muscle & Joint Infections", value: "bone-joint-muscle-infections" }
          - { label: "Cardiovascular", value: "cardiovascular" }
          - { label: "Central Nervous System", value: "cns" }
          - { label: "GI & Intraabdominal", value: "gi-intraabdominal" }
          - { label: "Head and Neck", value: "head-and-neck" }
          - { label: "Lungs & Mediastinum", value: "lung-and-mediastinum" }
          - { label: "Skin & Soft Tissue Infections", value: "ssti-main-menu" }
          - { label: "Systemic Infections", value: "system-infectious-diseases" }
          - { label: "Urogenital", value: "genitourinary" }
          - { label: "Organisms", value: "organisms" }
          - { label: "Dermatological Guidelines", value: "dermatologic-surgery-guidelines" }
          - { label: "Device-Related Infections", value: "device-related-infections" }
          - { label: "HIV / AIDS", value: "hiv-aids" }
          - { label: "Immunocompromised Patients", value: "immunocompromised-patient" }
          - { label: "MPox Treatment", value: "tpoxx-monkeypox-treatment" }
          - { label: "Prevention of Infection", value: "prevention-of-infection" }
          - { label: "Recommended Adult Immunizations", value: "recommended-immunizations" }
          - { label: "Surgical Antimicrobial Prophylaxis", value: "surgical-antimicrobial-prophylaxis" }
          - { label: "Surgical Site Infections", value: "surgical-site-infections" }
          - { label: "Bispecific Antibody", value: "bispecific-antibody" }
          - { label: "Help & Resources", value: "help-page" }
          - { label: "Important Antimicrobial Information", value: "important-antimicrobial" }
          - { label: "General / Miscellaneous", value: "general" }
      - label: "Clinical Group (display label)"
        name: GroupLabel
        widget: hidden
        default: ""
        hint: "Auto-generated human-readable Group label used for section headers in the Sveltia entry list. Managed by scripts/set-group-labels.py — do not edit by hand."
      - label: "Sort Order (internal — do not edit)"
        name: SortKey
        widget: hidden
        default: "zzz"
        hint: "Auto-generated so the group's nav page sorts first in this list. Managed by scripts/set-nav-sort-keys.py — do not edit by hand."
      - label: "Display Title (search label)"
        name: Term1
        widget: string
        hint: "Human-readable title shown in the search dropdown."
      - label: "Alternate Search Term"
        name: Term2
        widget: string
        required: false
      - label: "Content"
        name: Text
        widget: markdown
        required: false
        hint: "Write content here. Link to other pages using [Label](page-id) where page-id is shown at the bottom of the target page on the live site."
      - label: "Source Inpatient Menu (read-only)"
        name: Inpt
        widget: string
        required: false
        hint: "Legacy VistA inpatient source menu. Do not edit."


name: Sync AbxLinks from CMS

on:
  push:
    branches: [main]
    paths:
      - "cms-data/abx-links.cms.json"

jobs:
  sync:
    # Skip if this push was already made by the bot (prevents loops)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract entries into AbxLinks.json
        run: jq '.entries' cms-data/abx-links.cms.json > AbxLinks.json

      - name: Commit updated AbxLinks.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AbxLinks.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync AbxLinks.json from CMS [skip ci]"
            git push
          fi

name: Sync Document Links from CMS

on:
  push:
    branches: [main]
    paths:
      - "cms-data/001-TestStation/documents/*.json"
      - "scripts/sync-document-links.py"

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync exact document URLs and markdown links
        run: python scripts/sync-document-links.py

      - name: Commit updated document entries (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cms-data/001-TestStation/documents/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync exact document links from CMS [skip ci]"
            git push
          fi
